name: Normalize generated portfolio

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "coverage.svg"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize generated files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          coverage = Path("coverage.svg")
          if coverage.exists():
              text = coverage.read_text(encoding="utf-8")
              dark_style = """<style>
                .bg{fill:#0d1117}.tx{fill:#e6edf3}.dim{fill:#7d8590}.none{fill:#21262d}
                .e{fill:#3fb950}.m{fill:#d29922}.h{fill:#f85149}.u{fill:#484f58}
              </style>"""
              coverage.write_text(
                  re.sub(r"<style>.*?</style>", dark_style, text, count=1, flags=re.S),
                  encoding="utf-8",
              )

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          text = re.sub(
              r"\n\[\*\*Browse the interactive portfolio\*\*\]\([^\n]+\)\n",
              "\n",
              text,
          )

          practice = (
              "## How I practice\n\n"
              "I first solve each problem independently, usually starting with the most "
              "straightforward correct implementation. Then I review the explanation or "
              "alternative solution, rewrite it more cleanly or efficiently, and check the "
              "**computational complexity, numerical behavior and trade-offs** behind the "
              "improved version.\n\n"
          )

          if "## How I practice" not in text and "## Problems" in text:
              text = text.replace("## Problems", practice + "## Problems", 1)

          text = text.replace("| easy |", "| Easy |")
          text = text.replace("| medium |", "| Medium |")
          text = text.replace("| hard |", "| Hard |")

          text = re.sub(
              r"\n+---\n+\n_(?:This file is regenerated by Deep-ML on every push\.|"
              r"Progress continues to evolve as new Deep-ML problems are solved\.)_\n?$",
              "\n",
              text,
          )
          text = re.sub(r"\n{3,}", "\n\n", text).rstrip() + "\n"
          readme.write_text(text, encoding="utf-8")
          PY

      - name: Commit only when normalization changed files
        run: |
          if git diff --quiet -- README.md coverage.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md coverage.svg
          git commit -m "Keep generated portfolio clean"
          git push
