name: Normalize generated portfolio

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "coverage.svg"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize generated files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          coverage = Path("coverage.svg")
          if coverage.exists():
              text = coverage.read_text(encoding="utf-8")
              dark_style = """<style>
                .bg{fill:#0d1117}.tx{fill:#e6edf3}.dim{fill:#7d8590}.none{fill:#21262d}
                .e{fill:#3fb950}.m{fill:#d29922}.h{fill:#f85149}.u{fill:#484f58}
              </style>"""
              coverage.write_text(
                  re.sub(r"<style>.*?</style>", dark_style, text, count=1, flags=re.S),
                  encoding="utf-8",
              )

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          text = re.sub(
              r"\n\[\*\*Browse the interactive portfolio\*\*\]\([^\n]+\)\n",
              "\n",
              text,
          )

          practice = (
              "## How I practice\n\n"
              "I first solve each problem independently, usually starting with the most "
              "straightforward correct implementation. Then I review the explanation or "
              "alternative solution, rewrite it more cleanly or efficiently, and check the "
              "**computational complexity, numerical behavior and trade-offs** behind the "
              "improved version.\n\n"
          )

          if "## How I practice" not in text and "## Problems" in text:
              text = text.replace("## Problems", practice + "## Problems", 1)

          text = re.sub(
              r"(\*\*\d+\*\* solved · \d+ problems)(?: · 0 labs)?(?: · 0 math)?",
              r"\1",
              text,
          )
          text = text.replace("| easy |", "| Easy |")
          text = text.replace("| medium |", "| Medium |")
          text = text.replace("| hard |", "| Hard |")

          text = re.sub(
              r"\n+---\n+\n_(?:This file is regenerated by Deep-ML on every push\.|"
              r"Progress continues to evolve as new Deep-ML problems are solved\.)_\n?$",
              "\n",
              text,
          )
          # Deep-ML rewrites README on each submission. Re-sort the generated
          # Problems table on every push so newest first survives regeneration.
          import json

          timestamps = {}
          progress_file = Path("progress.json")
          if progress_file.exists():
              try:
                  progress = json.loads(progress_file.read_text(encoding="utf-8"))
                  timestamps = {
                      record["path"].strip("/"): record.get("first_solved_at", "")
                      for record in progress.get("items", {}).values()
                      if record.get("path")
                  }
              except (OSError, json.JSONDecodeError) as exc:
                  print(f"Unable to load precise solution timestamps: {exc}")

          lines = text.splitlines()
          try:
              problems_index = lines.index("## Problems")
          except ValueError:
              problems_index = -1

          if problems_index >= 0:
              header_index = next(
                  (i for i in range(problems_index + 1, len(lines))
                   if re.search(r"\|\s*Solved\s*\|", lines[i])),
                  -1,
              )
              if header_index >= 0 and header_index + 1 < len(lines):
                  start = header_index + 2  # Skip the Markdown separator row.
                  end = start
                  while end < len(lines) and lines[end].startswith("|"):
                      end += 1

                  def date_key(row):
                      match = re.search(r"\|\s*(\d{4}-\d{2}-\d{2})\s*\|", row)
                      path = re.search(r"\]\((problems/[^)]+)\)", row)
                      day = match.group(1) if match else ""
                      return timestamps.get(path.group(1), day) if path else day

                  rows = lines[start:end]
                  rows.sort(key=str.casefold)
                  rows.sort(key=date_key, reverse=True)
                  lines[start:end] = rows
                  text = "\n".join(lines)

          text = re.sub(r"\n{3,}", "\n\n", text).rstrip() + "\n"
          readme.write_text(text, encoding="utf-8")
          PY

      - name: Commit only when normalization changed files
        run: |
          if git diff --quiet -- README.md coverage.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md coverage.svg
          git commit -m "Keep generated portfolio clean"
          git push
